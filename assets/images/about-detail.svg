      <stop offset="0" stop-color="#F8EDE2"/><stop offset="0.48" stop-color="#EACDB9"/><stop offset="1" stop-color="#D0A283"/>
    </linearGradient>
    <radialGradient id="hlaboutdetail" cx="0.66" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vgaboutdetail" cx="0.5" cy="0.5" r="0.78">
