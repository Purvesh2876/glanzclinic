<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bgbridal" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F9EBE0"/><stop offset="0.48" stop-color="#EFCEBB"/><stop offset="1" stop-color="#D5A187"/>
    </linearGradient>
    <radialGradient id="hlbridal" cx="0.66" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
