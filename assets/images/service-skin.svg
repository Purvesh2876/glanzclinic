      <stop offset="0" stop-color="#F7E6DA"/><stop offset="0.48" stop-color="#EBC5B2"/><stop offset="1" stop-color="#D19A82"/>
    </linearGradient>
    <radialGradient id="hlserviceskin" cx="0.66" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vgserviceskin" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#D19A82" stop-opacity="0"/><stop offset="1" stop-color="#D19A82" stop-opacity="0.55"/>
