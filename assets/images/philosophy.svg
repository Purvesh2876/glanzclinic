<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bgphilosophy" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F4E4D8"/><stop offset="0.48" stop-color="#E4C2AE"/><stop offset="1" stop-color="#C08F72"/>
    </linearGradient>
    <radialGradient id="hlphilosophy" cx="0.66" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vgphilosophy" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#C08F72" stop-opacity="0"/><stop offset="1" stop-color="#C08F72" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="blphilosophy" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="140"/></filter>
